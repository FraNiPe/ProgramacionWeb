<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/registro.css">
    <link rel="stylesheet" href="../css/header-footer.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <title>Registrarse - Relatos & Hojas</title>
</head>
<body>

    <!--header y navbar-->
    <header id="main-header" class="header-wrapper"></header>

    <!--main-->

    <main class="container">
        <section class="seccion1">
            <img src="../img/1f756cacd75c55ed7c4abd60c31df7e831fd33b5.jpg" alt="imagen_registrarse">
            <p class="textop1">Un refugio para mentes curiosas</p>
            <p class="textop2">Lleva un registro de tus lecturas, comparte tus reseñas y descubre nuevas historias
                seleccionadas con cuidado.</p>


        </section>
        <section class="seccion2">

            <p class="bienvenido">Bienvenido a Relatos & Hojas</p>
            <h2 class="seccion2_titulo"> Crea tu cuenta </h2>
            <p class="subtitulo"> Únete a nuestra comunidad de lectores apasionados</p>


            <form class="form_registro" id="form_reg" action="../pages/perfil.html" method="GET">

                <label for="nombre"> NOMBRE DE USUARIO </label>
                <input type="text" name="nombre" id="nombre" placeholder="Ej: lector nocturno" >
                <p id="error_nom"></p>

                <label for="email"> CORREO ELECTRÓNICO </label>
                <input type="email" name="email" id="email" placeholder="Ej: lectornocturno@gmail.com" >
                <p id="error_email"></p>

                <label for="contrasena"> CONTRASEÑA </label>
                <input type="password" name="contrasena" id="contrasena" placeholder="************" >
                <p id="error_contra"></p>

                <button type="reset" id="reset">RESET</button>
                <button class="enviar" type="submit"> COMPLETAR REGISTRO</button>
                <p class="in_sesion">¿Ya tenés cuenta? <a href="../pages/login.html">Inicia Sesión</a></p>




            </form>



        </section>




    </main>

    <footer id= "main-footer" class="footer-wrapper"></footer>
    <script type="module" src="../js/header-footer.js"></script>
    <script src="../js/registro.js"></script>

</body>

</html>
