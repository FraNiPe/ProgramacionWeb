<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>

    <link rel="stylesheet" href="../css/recuperar.css">
    <link rel="stylesheet" href="../css/header-footer.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet">

</head>

<body>

    <!--header y navbar-->
    <header id="main-header" class="header-wrapper"></header>

    <!--main-->
    <main class="contenedor">

        <div class="lado-izquierdo">

            <img src="../img/788b0a2f8daec6b29cbbe95b1b19dab295340156.jpg" alt="Biblioteca">

            <div class="texto-imagen">

                <h2>Recupera tu historia</h2>

                <p>
                    No te preocupes si perdiste la página.
                    Te ayudaremos a volver a tu biblioteca digital.
                </p>

            </div>

        </div>



        <div class="lado-derecho">

            <a href="../pages/login.html" class="volver">
                ← VOLVER A INICIO DE SESIÓN
            </a>

            <p class="subtitulo">
                RECUPERACIÓN
            </p>

            <h1>Restablecer</h1>

            <p class="descripcion">
                Ingrese su usuario y cree una nueva contraseña
                para recuperar el acceso a su cuenta.
            </p>


            <form class="formulario" id="form_recuperar">

                <label for="usuario">USUARIO</label>
                <input type="text" id="usuario" placeholder="Ingrese su usuario" >
                <p id="error_usuario"></p>

                <label for="password">NUEVA CONTRASEÑA</label>
                <input type="password" id="password" placeholder="Ingrese la contraseña" >
                <p id="error_password"></p>

                <label for="repetir">REPETIR CONTRASEÑA</label>
                <input type="password" id="repetir" placeholder="Repita la contraseña" >
                <p id="error_repetir"></p>

                <button type="submit">
                    RESTABLECER CONTRASEÑA 
                </button>

            </form>

        </div>

    </main>


    <footer id= "main-footer" class="footer-wrapper"></footer>
    <script type="module" src="../js/header-footer.js"></script>
    <script type="module" src="../js/recuperar.js"></script>

</body>

</html>
