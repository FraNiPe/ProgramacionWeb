<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta</title>
    <link rel="stylesheet" href="../css/header-footer.css">
    <link rel="stylesheet" href="../css/perfil.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!--header y navbar-->
    <header id="main-header" class="header-wrapper"></header>

    <!--main-->

    <div class="contenedor">

        <!-- lado izquierdo -->
        <aside class="barra-lateral">

            <div class="tarjeta-perfil">

                <div class="foto-perfil">
                    V
                </div>
                <h2></h2>
                <p></p>
                <button id="btn-cerrar-sesion" class="btn-logout">
                    Cerrar Sesión
                </button>

            </div>


            <div class="tarjeta-biblioteca">

                <h4>Tu biblioteca</h4>

                <div class="meta">

                    <div class="fila-meta">

                        <span>Meta lectura</span>

                        <span>12 / 24</span>

                    </div>

                    <div class="barra">

                        <div class="progreso"></div>

                    </div>

                </div>


                <div class="generos">

                    <h5>Géneros</h5>

                    <div class="etiquetas">
                    </div>

                </div>


                <div class="autores">

                    <h5>Autores</h5>

                    <ul>
                    </ul>

                </div>

            </div>

        </aside>


        <main class="contenido">

            <div class="menu2">

                <a href="#">Favoritos</a>

            </div>


            <div class="titulo">

                <h1>Guardados</h1>

                <span>4 libros</span>

            </div>


            <div class="grilla-libros">

            </div>

        </main>

    </div>

    <footer id= "main-footer" class="footer-wrapper"></footer>
    <script type="module" src="../js/header-footer.js"></script>
    <script type="module" src="../js/perfil.js"></script>
