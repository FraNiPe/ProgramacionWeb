<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/header-footer.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <title>Inicio sesión- Relatos & Hojas</title>
</head>
<body>

    <!--header y navbar-->
    <header id="main-header" class="header-wrapper"></header>

    <!--main-->

    <main class="container">
        <section class="seccion1">
            <img src="../img/7bd3ae901c1deefa316911ed73348cc90d22090b.jpg" alt="imagen_login">
            <p class="textop1">Bienvenido de vuelta</p>
            <p class="textop2">Tus próximas lecturas y tu estanteria digital te estan esperando.
                Continúa donde lo dejaste.
            </p>


        </section>
        <section class="seccion2">
            <p class="bienvenido">acceso a tu cuenta</p>
            <h2 class="seccion2_titulo"> Iniciar Sesión </h2>
            <p class="subtitulo"> Ingresa tus credenciales para acceder a tu biblioteca.</p>


            <form class="form_login" action="../pages/perfil.html" method="GET">

                <label for="nombre"> NOMBRE DE USUARIO O CORREO ELECTRÓNICO</label>
                <input type="text" name="nombre" id="nombre" placeholder="Ej: usuario o lectornocturno@gmail.com " required autofocus>


                <div class="container_contrasena">
                    <label for="contrasena"> CONTRASEÑA </label> <a href="../pages/recuperar.html">¿Olvidaste tu contraseña?</a>

                </div>

                <input type="password" name="contrasena" id="contrasena" placeholder="************" required>


                <button type="submit"> INGRESAR  </button>
                <p class="in_sesion">¿No tienes una cuenta?<a href="../pages/registro.html">Registrate aquí</a></p>




            </form>



        </section>




    </main>

    <footer id= "main-footer" class="footer-wrapper"></footer>
    <script type="module" src="../js/header-footer.js"></script>

</body>

</html>
